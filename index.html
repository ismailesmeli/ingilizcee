<!doctype html>
<html lang="tr">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Margin — İngilizce Okuma</title>
    <style>
         :root {
            color-scheme: dark;
            --bg: #111310;
            --panel: #191c18;
            --panel-soft: #20241f;
            --line: #30372e;
            --text: #e8e9df;
            --muted: #a1a89a;
            --accent: #c7dc91;
            --accent-ink: #1c2510;
            --paper: #d9cba9;
            --danger: #f0a49b;
            font-family: Inter, ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
        }
        
        * {
            box-sizing: border-box;
        }
        
        body {
            margin: 0;
            min-height: 100vh;
            background: radial-gradient(ellipse at 18% 0%, #293126 0, transparent 38rem), var(--bg);
            color: var(--text);
        }
        
        button,
        input {
            font: inherit;
        }
        
        button {
            cursor: pointer;
        }
        
        .app {
            width: min(1180px, 100%);
            margin: 0 auto;
            padding: 30px 28px 60px;
        }
        
        .topbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 20px;
            margin-bottom: 34px;
        }
        
        .brand {
            display: flex;
            align-items: center;
            gap: 11px;
        }
        
        .brand-mark {
            width: 36px;
            height: 36px;
            display: grid;
            place-items: center;
            border: 1px solid #59664a;
            border-radius: 12px;
            color: var(--accent);
            font-weight: 800;
            transform: rotate(-5deg);
        }
        
        .brand-name {
            font-weight: 750;
            letter-spacing: .02em;
        }
        
        .brand-sub {
            color: var(--muted);
            font-size: 12px;
            margin-top: 2px;
        }
        
        .top-actions { display:flex; align-items:center; gap:9px; }
        .bookmark-open { width:38px; height:34px; border:1px solid var(--line); border-radius:9px; color:var(--accent); background:#20271d; font-size:22px; line-height:1; letter-spacing:2px; }
        .bookmark-open:hover { background:#2d3927; }
        .admin-open { border:1px solid var(--line); border-radius:999px; padding:8px 12px; color:var(--muted); background:transparent; font-size:12px; }
        .admin-open:hover { color:var(--accent); border-color:#56634a; }
        .note-editor { display:flex; gap:6px; margin-top:9px; }
        .note-input { flex:1; min-width:0; border:1px solid #3b4337; border-radius:7px; padding:7px 8px; color:var(--text); background:#171b16; font-size:12px; }
        .note-save { border:1px solid #56634a; border-radius:7px; padding:6px 8px; color:var(--accent); background:#252d21; font-size:11px; }
        .admin-modal { position:fixed; inset:0; z-index:20; display:grid; place-items:center; padding:18px; background:#080a08b8; }
        .admin-modal[hidden] { display:none; }
        .admin-card { width:min(620px,100%); max-height:90vh; overflow:auto; padding:22px; border:1px solid #56634a; border-radius:16px; background:#1a2019; box-shadow:0 24px 80px #000b; }
        .admin-head { display:flex; justify-content:space-between; align-items:center; margin-bottom:16px; }
        .admin-title { margin:0; font:24px Georgia,serif; }
        .admin-close { border:0; background:transparent; color:var(--muted); font-size:22px; }
        .admin-label { display:block; margin:12px 0 6px; color:var(--muted); font-size:12px; }
        .admin-field { width:100%; border:1px solid #3b4337; border-radius:8px; padding:9px 10px; color:var(--text); background:#111510; }
        .admin-textarea { min-height:150px; resize:vertical; }
        .admin-help { color:var(--muted); font-size:11px; line-height:1.5; margin-top:5px; }
        .admin-submit { margin-top:16px; border:0; border-radius:9px; padding:11px 14px; color:var(--accent-ink); background:var(--accent); font-weight:700; }
        .admin-message { color:var(--accent); font-size:12px; margin-left:10px; }

            color: var(--muted);
            font-size: 13px;
            border: 1px solid var(--line);
            border-radius: 999px;
            padding: 8px 12px;
        }
        
        .layout {
            display: grid;
            grid-template-columns: minmax(0, 1fr) 290px;
            gap: 36px;
            align-items: start;
        }
        
        .reading {
            min-width: 0;
        }
        
        .eyebrow {
            color: var(--accent);
            text-transform: uppercase;
            letter-spacing: .16em;
            font-size: 11px;
            font-weight: 700;
        }
        
        h1 {
            font-family: Georgia, "Times New Roman", serif;
            font-weight: 500;
            font-size: clamp(34px, 5vw, 52px);
            letter-spacing: -.035em;
            margin: 12px 0 10px;
        }
        
        .meta {
            color: var(--muted);
            font-size: 13px;
        }
        
        .divider {
            height: 1px;
            background: var(--line);
            margin: 25px 0 28px;
        }
        
        .sentence { position: relative; }
        .sentence-tools { display: inline-flex; margin-left: 7px; vertical-align: middle; opacity: 0; transform: translateY(2px); transition: opacity .18s ease, transform .18s ease; }
        .sentence:hover .sentence-tools, .sentence:focus-within .sentence-tools { opacity: 1; transform: translateY(0); }
        .translate-btn { width: 24px; height: 24px; border: 1px solid #56634a; border-radius: 50%; padding: 0; background: #252d21; color: var(--accent); font: 700 15px/1 Inter, sans-serif; }
        .translate-btn:hover { background: var(--accent); color: var(--accent-ink); transform: scale(1.08); }
        .sentence-translation { margin: 9px 0 4px; padding: 11px 14px; border-left: 2px solid var(--accent); border-radius: 0 9px 9px 0; background: #20251d; color: #cbd5b9; font: 14px/1.55 Inter, sans-serif; }
        @media (max-width: 760px) { .sentence-tools { opacity: 1; transform: none; } }
        .reading-progress { padding: 14px 18px 4px; border-bottom: 1px solid #37382f; }
        .progress-row { display:flex; justify-content:space-between; color:var(--muted); font-size:11px; margin-bottom:7px; }
        .progress-track { height:6px; border-radius:99px; background:#30372e; overflow:hidden; }
        .progress-fill { height:100%; width:0; border-radius:inherit; background:linear-gradient(90deg,var(--accent),#94b66b); transition:width .25s ease; }
        .story-footer { display:flex; justify-content:flex-end; margin-top:18px; }
        .quiz-toggle { border:1px solid #56634a; border-radius:10px; padding:10px 14px; color:var(--accent); background:#20271d; font-size:13px; font-weight:700; }
        .quiz-toggle:hover { background:#2d3927; }
        .quiz-panel { margin-top:18px; padding:18px; border:1px solid var(--line); border-radius:14px; background:#191e18; }
        .quiz-panel[hidden] { display:none; }
        .quiz-title { margin:0 0 4px; font:21px Georgia,serif; }
        .quiz-subtitle { margin:0 0 16px; color:var(--muted); font-size:12px; }
        .quiz-question { padding:13px 0; border-top:1px solid #2e352d; }
        .quiz-question:first-of-type { border-top:0; }
        .quiz-question p { margin:0 0 9px; font-size:14px; }
        .quiz-options { display:flex; flex-wrap:wrap; gap:7px; }
        .quiz-option { border:1px solid #3c4738; border-radius:8px; padding:8px 10px; color:#cbd5b9; background:#20251e; font-size:12px; }
        .quiz-option:hover { border-color:var(--accent); }
        .quiz-option.correct { border-color:#9fc878; background:#2b3d25; color:#ddedc7; }
        .quiz-option.wrong { border-color:#c78579; background:#3b2724; color:#f0c4bc; }
        .quiz-result { margin-top:14px; color:var(--accent); font-size:13px; font-weight:700; }
        .speak-btn { width:23px; height:23px; margin-left:5px; border:1px solid #56634a; border-radius:50%; color:#bbc995; background:#222a20; font-size:12px; vertical-align:middle; opacity:0; transition:opacity .18s ease; }
        .sentence:hover .speak-btn, .sentence:focus-within .speak-btn { opacity:1; }
        @media (max-width:760px) { .speak-btn { opacity:1; } }
        .layout { display:block; }
        .reading { max-width:760px; }
        .bookmark-panel { position:fixed; top:84px; right:18px; z-index:12; width:290px; max-height:calc(100vh - 108px); transition:transform .24s ease, box-shadow .24s ease; }
        .bookmark-panel.is-collapsed { transform:translateX(calc(100% - 42px)); box-shadow:none; }
        .bookmark-toggle { position:absolute; left:-38px; top:12px; width:34px; height:34px; border:1px solid #56634a; border-radius:9px 0 0 9px; color:var(--accent); background:#252d21; font-size:18px; }
        .bookmark-toggle:hover { background:var(--accent); color:var(--accent-ink); }
        .note-toggle { margin-top:8px; border:0; color:var(--muted); background:transparent; padding:0; font-size:11px; }
        .note-toggle:hover { color:var(--accent); }
        .note-editor[hidden] { display:none; }
        @media (max-width:760px) { .bookmark-panel { top:auto; right:10px; bottom:10px; max-height:70vh; } .bookmark-panel.is-collapsed { transform:translateX(calc(100% - 42px)); } }
        .story {
            font-family: Georgia, "Times New Roman", serif;
            font-size: 19px;
            line-height: 1.95;
            color: #d7d8ce;
            max-width: 720px;
        }
        
        .story p {
            margin: 0 0 22px;
        }
        
        .word {
            display: inline;
            color: inherit;
            border: 0;
            border-radius: 4px;
            padding: 0 1px;
            background: transparent;
            line-height: inherit;
            font-family: inherit;
            font-size: inherit;
        }
        
        .word:hover,
        .word:focus-visible {
            color: var(--accent);
            background: #30382a;
            outline: none;
        }
        
        .word.is-saved {
            text-decoration: underline;
            text-decoration-color: #91a86a;
            text-decoration-thickness: 2px;
            text-underline-offset: 4px;
        }
        
        .bookmark-panel {
            position: sticky;
            top: 24px;
            overflow: hidden;
            border: 1px solid #514d3f;
            border-radius: 10px 10px 14px 14px;
            background: linear-gradient(150deg, #29281f, #1b1d18 42%);
            box-shadow: 0 18px 50px #0005, inset 0 1px #ffffff0b;
        }
        
        .bookmark-panel::before {
            content: "";
            display: block;
            height: 5px;
            background: repeating-linear-gradient(90deg, #879662 0 18px, #b5c686 18px 36px);
            opacity: .75;
        }
        
        .panel-head {
            padding: 20px 18px 15px;
            border-bottom: 1px solid #37382f;
        }
        
        .panel-title-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        
        .panel-title {
            font-family: Georgia, serif;
            font-size: 21px;
        }
        
        .count {
            color: var(--accent);
            background: #353b2c;
            border-radius: 999px;
            min-width: 25px;
            padding: 4px 8px;
            text-align: center;
            font-size: 12px;
        }
        
        .panel-hint {
            color: var(--muted);
            font-size: 12px;
            margin-top: 7px;
        }
        
        .bookmark-list {
            padding: 8px 12px 14px;
            max-height: 58vh;
            overflow: auto;
        }
        
        .bookmark-item {
            padding: 12px 7px;
            border-bottom: 1px solid #34362e;
        }
        
        .bookmark-item:last-child {
            border-bottom: 0;
        }
        
        .bookmark-word {
            color: var(--paper);
            font-weight: 700;
        }
        
        .bookmark-meaning {
            color: #c3c8b8;
            font-size: 13px;
            margin-top: 4px;
        }
        
        .bookmark-note {
            color: var(--muted);
            font-size: 12px;
            margin-top: 6px;
            font-style: italic;
        }
        
        .remove-btn {
            border: 0;
            background: transparent;
            color: #9da294;
            float: right;
            padding: 1px 5px;
            font-size: 17px;
        }
        
        .remove-btn:hover {
            color: var(--danger);
        }
        
        .empty {
            color: var(--muted);
            font-size: 13px;
            line-height: 1.6;
            padding: 14px 5px 18px;
        }
        
        .tooltip {
            position: fixed;
            z-index: 10;
            width: min(280px, calc(100vw - 28px));
            padding: 15px;
            border: 1px solid #59634a;
            border-radius: 13px;
            background: #252a22;
            box-shadow: 0 15px 40px #0009;
        }
        
        .tooltip[hidden] {
            display: none;
        }
        
        .tooltip::after {
            content: "";
            position: absolute;
            left: 25px;
            bottom: -7px;
            width: 12px;
            height: 12px;
            background: #252a22;
            border-right: 1px solid #59634a;
            border-bottom: 1px solid #59634a;
            transform: rotate(45deg);
        }
        
        .tip-word {
            font-family: Georgia, serif;
            font-size: 21px;
            color: var(--paper);
        }
        
        .tip-meaning {
            color: #d4d8ca;
            margin: 5px 0 13px;
        }
        
        .tip-input {
            display: none;
            width: 100%;
            border: 1px solid var(--line);
            border-radius: 8px;
            padding: 9px 10px;
            margin: 0 0 11px;
            color: var(--text);
            background: #171a16;
        }
        
        .tip-input.visible {
            display: block;
        }
        
        .tip-actions {
            display: flex;
            gap: 8px;
        }
        
        .save-btn,
        .close-btn {
            border: 0;
            border-radius: 8px;
            padding: 9px 11px;
            font-size: 12px;
            font-weight: 700;
        }
        
        .save-btn {
            background: var(--accent);
            color: var(--accent-ink);
        }
        
        .close-btn {
            background: #393e35;
            color: var(--text);
        }
        
        @media (max-width: 760px) {
            .app {
                padding: 22px 17px 44px;
            }
            .layout {
                grid-template-columns: 1fr;
                gap: 28px;
            }
            .bookmark-panel {
                position: static;
            }
            .bookmark-list {
                max-height: 320px;
            }
            .story {
                font-size: 18px;
            }
            .status {
                display: none;
            }
        }
    
        /* Sağ kenarda sabit ayraç çekmecesi */
        .layout { display:block !important; }
        .reading { max-width:760px; }
        .bookmark-panel { position:fixed !important; top:84px !important; right:18px !important; bottom:auto !important; left:auto !important; z-index:50 !important; width:290px !important; max-height:calc(100vh - 108px) !important; transition:transform .24s ease, box-shadow .24s ease !important; }
        .bookmark-panel.is-collapsed { transform:translateX(110%) !important; pointer-events:none; }
        .bookmark-toggle { position:absolute !important; left:-38px !important; top:12px !important; width:34px !important; height:34px !important; border:1px solid #56634a !important; border-radius:9px 0 0 9px !important; color:var(--accent) !important; background:#252d21 !important; font-size:18px !important; }
        .bookmark-toggle { left:auto !important; right:10px !important; top:12px !important; border-radius:50% !important; z-index:2; }
        @media (max-width:760px) { .bookmark-panel { top:auto !important; right:10px !important; bottom:10px !important; max-height:70vh !important; } }
    </style>
</head>

<body>
    <main class="app">
        <header class="topbar">
            <div class="brand">
                <div class="brand-mark" aria-hidden="true">m</div>
                <div>
                    <div class="brand-name">margin</div>
                    <div class="brand-sub">Read a little. Learn a lot.</div>
                </div>
            </div>
            <div class="top-actions"><div class="status">● &nbsp;Okuma oturumu</div><button id="admin-open" class="admin-open" type="button">Yönet</button><button id="bookmark-open" class="bookmark-open" type="button" aria-label="Ayraç menüsünü aç">⋯</button></div>
        </header>

        <div class="layout">
            <section class="reading" aria-labelledby="story-title">
                <div id="story-level" class="eyebrow">A1 · Easy story</div>
                <h1 id="story-title">A Cat at the Door</h1>
                <div id="story-meta" class="meta">At home · 2 min read</div>
                <label class="story-picker-label" for="story-picker">Hikâye seç</label>
                <select id="story-picker" class="story-picker" aria-label="Okunacak hikâyeyi seç"></select>
                <div class="divider"></div>
                <article id="story" class="story" aria-label="İngilizce okuma metni"></article>
                <div class="story-footer"><button id="quiz-toggle" class="quiz-toggle" type="button">Mini testi aç</button></div>
                <section id="quiz-panel" class="quiz-panel" aria-live="polite" hidden></section>
            </section>

            <aside class="bookmark-panel is-collapsed" aria-labelledby="bookmark-title">
                <div class="panel-head">
                    <div class="panel-title-row">
                        <div id="bookmark-title" class="panel-title">Ayraç</div><button id="bookmark-toggle" class="bookmark-toggle" type="button" aria-label="Ayraç panelini aç">‹</button>
                        <span id="bookmark-count" class="count">0</span>
                    </div>
                    <div class="panel-hint">Öğrendiğin kelimeler burada saklanır.</div>
                </div>
                <div class="reading-progress"><div class="progress-row"><span>Okuma ilerlemesi</span><span id="progress-label">0%</span></div><div class="progress-track"><div id="progress-fill" class="progress-fill"></div></div></div>
                <div id="bookmark-list" class="bookmark-list"></div>
            </aside>
        </div>
    </main>

    <section id="admin-modal" class="admin-modal" role="dialog" aria-modal="true" aria-labelledby="admin-title" hidden>
      <form id="admin-form" class="admin-card">
        <div class="admin-head"><h2 id="admin-title" class="admin-title">Yeni hikâye ekle</h2><button id="admin-close" class="admin-close" type="button" aria-label="Kapat">×</button></div>
        <label class="admin-label" for="admin-story-title">Hikâye başlığı</label><input id="admin-story-title" class="admin-field" required placeholder="Örn. A New Morning">
        <label class="admin-label" for="admin-story-level">Seviye</label><input id="admin-story-level" class="admin-field" value="A1 · Easy story">
        <label class="admin-label" for="admin-story-meta">Kısa açıklama</label><input id="admin-story-meta" class="admin-field" value="Daily life · 3 min read">
        <label class="admin-label" for="admin-story-text">Hikâye metni</label><textarea id="admin-story-text" class="admin-field admin-textarea" required placeholder="Her cümleyi ayrı satıra yaz."></textarea>
        <label class="admin-label" for="admin-story-words">Kelime anlamları</label><textarea id="admin-story-words" class="admin-field admin-textarea" placeholder="apple = elma
walk = yürümek"></textarea><div class="admin-help">Her satıra bir kelime yaz: <b>İngilizce = Türkçe</b></div>
        <button class="admin-submit" type="submit">Hikâyeyi kaydet</button><span id="admin-message" class="admin-message"></span>
      </form>
    </section>

    <section id="tooltip" class="tooltip" role="dialog" aria-label="Kelime anlamı" hidden>
        <div id="tip-word" class="tip-word"></div>
        <div id="tip-meaning" class="tip-meaning"></div>
        <input id="tip-input" class="tip-input" type="text" placeholder="Türkçe anlamını yaz…">
        <div class="tip-actions">
            <button id="save-word" class="save-btn" type="button">＋ Ayraç'a ekle</button>
            <button id="close-tip" class="close-btn" type="button">Kapat</button>
        </div>
    </section>

    <script>
        // Metin ve örnek sözlük; gerçek projede API ile değiştirilebilir.
        const STORIES = [
            {
                title: "A Cat at the Door", level: "A1 · Easy story", meta: "At home · 2 min read",
                paragraphs: [
                    "Mia has a small cat. The cat is white and very soft.",
                    "One morning, the cat sits by the door. It wants to go outside.",
                    "Mia opens the door. The cat runs to the garden and looks at a bird.",
                    "After ten minutes, the cat comes back. Mia gives it some milk. The cat is happy."
                ]
            },
            {
                title: "Ben’s New Bike", level: "A1 · Easy story", meta: "In town · 2 min read",
                paragraphs: [
                    "Ben has a new blue bike. It is a gift from his dad.",
                    "On Saturday, Ben rides his bike to the park. His friend Sam is there.",
                    "They ride around the lake. Then they eat apples and talk under a tree.",
                    "At five o’clock, Ben rides home. He is tired, but he is very glad."
                ]
            },
            {
                title: "The Red Apple", level: "A1 · Easy story", meta: "At the market · 2 min read",
                paragraphs: [
                    "Lena goes to the market with her mother. She sees a big red apple.",
                    "The apple looks good. Lena asks, ‘Can I have it?’ Her mother smiles.",
                    "They buy three apples, some bread, and a little cheese.",
                    "At home, Lena washes an apple. She cuts it in half and shares it with her brother."
                ]
            },
            {
                title: "A Day at the Beach", level: "A1 · Easy story", meta: "By the sea · 2 min read",
                paragraphs: [
                    "Tom and his sister go to the beach with their family.",
                    "The sun is warm. Tom swims in the sea, and his sister makes a sand house.",
                    "Their mother reads a book. Their father gets water and small cakes.",
                    "In the evening, they walk home. They are happy after a fun day."
                ]
            },
            {
                title: "The Little Seed", level: "A1 · Easy story", meta: "In the garden · 2 min read",
                paragraphs: [
                    "Ella finds a little seed in the garden. She puts it in the ground.",
                    "Every day, she gives the seed water. The sun shines on the ground.",
                    "One week later, a small green plant comes up. Ella is excited.",
                    "She takes care of the plant. Soon, it has a yellow flower."
                ]
            },
            {
                title: "Sam’s Busy Morning", level: "A1 · Easy story", meta: "Daily life · 2 min read",
                paragraphs: [
                    "Sam gets up at seven. He washes his face and puts on his clothes.",
                    "He eats eggs and bread for breakfast. He drinks a glass of water.",
                    "Then Sam walks to school with his sister. They talk about their day.",
                    "At school, Sam sees his friends. He says hello and opens his book."
                ]
            },
            {
                title: "A Rainy Day", level: "A1 · Easy story", meta: "At home · 2 min read",
                paragraphs: [
                    "Rain falls all morning. Nina looks out of the window.",
                    "She cannot play in the park, so she takes a book from the shelf.",
                    "Her little brother sits next to her. They read a story about a funny dog.",
                    "Later, the rain stops. Nina puts on her coat and goes outside."
                ]
            },
            {
                title: "The Helpful Boy", level: "A1 · Easy story", meta: "A kind act · 2 min read",
                paragraphs: [
                    "Ali sees an old man with two heavy bags. The man walks very slowly.",
                    "Ali asks, ‘Can I help you?’ The man gives him one bag.",
                    "They walk to the man’s house. He says, ‘Thank you, young friend.’",
                    "Ali smiles and walks home. He feels good because he helped someone."
                ]

        function saveTranslationCache() {
            localStorage.setItem(TRANSLATION_CACHE_KEY, JSON.stringify(translationCache));
        }

        async function translateSentence(sentence) {
            if (translationCache[sentence]) return translationCache[sentence];
            const url = "https://api.mymemory.translated.net/get?q=" + encodeURIComponent(sentence) + "&langpair=en|tr";
            const response = await fetch(url);
            if (!response.ok) throw new Error("Çeviri servisi yanıt vermedi");
            const data = await response.json();
            const translated = data?.responseData?.translatedText?.trim();
            if (!translated) throw new Error("Çeviri bulunamadı");
            translationCache[sentence] = translated;
            saveTranslationCache();
            return translated;
        }

        async function toggleSentenceTranslation(button) {
            const sentence = button.closest(".sentence");
            const oldTranslation = sentence.querySelector(".sentence-translation");
            if (oldTranslation) { oldTranslation.remove(); button.textContent = "↗"; return; }
            const translation = document.createElement("div");
            translation.className = "sentence-translation";
            translation.textContent = "Çevriliyor…";
            sentence.append(translation);
            button.textContent = "…";
            try {
                translation.textContent = await translateSentence(button.dataset.sentence);
                button.textContent = "×";
            } catch {
                translation.textContent = "Çeviri alınamadı. İnternet bağlantısını kontrol edip tekrar dene.";
                button.textContent = "↗";
            }
        }

        function buildQuiz() {
            const story = STORIES[currentStoryIndex];
            const words = [...new Set(story.paragraphs.join(" ").match(/[A-Za-z]+/g) || [])]
                .map((word) => normalizeWord(word)).filter((word) => DICTIONARY[word]);
            const selected = words.slice(0, 5);
            state.quiz = selected.map((word) => {
                const distractors = Object.values(DICTIONARY).filter((meaning) => meaning !== DICTIONARY[word]).slice(0, 2);
                return { word, answer: DICTIONARY[word], options: [DICTIONARY[word], ...distractors].sort(() => Math.random() - .5), picked: null };
            });
            state.quizScore = 0;
            renderQuiz();
        }

                box.append(question, options); panel.append(box);

        function answerQuiz(button) {
            const item = state.quiz[Number(button.dataset.index)];

            item.picked = button.dataset.answer;
            const correct = item.picked === item.answer;
            if (correct) state.quizScore += 1;
            button.classList.add(correct ? "correct" : "wrong");
            if (!correct) [...button.parentElement.children].find((el) => el.dataset.answer === item.answer)?.classList.add("correct");
            const answered = state.quiz.filter((entry) => entry.picked).length;
            if (answered === state.quiz.length) document.querySelector("#quiz-result").textContent = "Sonuç: " + state.quizScore + "/" + state.quiz.length + " doğru";

                remove.setAttribute("aria-label", `${item.word} kelimesini ayraçtan sil`);
                remove.addEventListener("click", () => removeBookmark(item.word));

                const word = document.createElement("div");
                word.className = "bookmark-word";
                word.textContent = item.word;

                const meaning = document.createElement("div");
                meaning.className = "bookmark-meaning";
                meaning.textContent = item.meaning;

                card.append(remove, word, meaning);
                if (item.note) { const note = document.createElement("div"); note.className = "bookmark-note"; note.textContent = item.note; card.append(note); }
                const noteToggle = document.createElement("button");
                noteToggle.type = "button"; noteToggle.className = "note-toggle"; noteToggle.textContent = item.note ? "Notu düzenle" : "＋ Not ekle"; noteToggle.dataset.noteWord = item.word;
                card.append(noteToggle);
                const noteEditor = document.createElement("div");
                noteEditor.className = "note-editor"; noteEditor.hidden = true;
                const noteInput = document.createElement("input");
                noteInput.className = "note-input"; noteInput.placeholder = "Kendi notunu yaz…"; noteInput.value = item.note || "";
                noteInput.dataset.noteWord = item.word;
                const noteSave = document.createElement("button");
                noteSave.type = "button"; noteSave.className = "note-save"; noteSave.textContent = "Kaydet"; noteSave.dataset.noteWord = item.word;
                noteEditor.append(noteInput, noteSave);
                card.append(noteEditor);
                listEl.append(card);
            });

            updateSavedWordStyles();
        }

        function updateSavedWordStyles() {
            const saved = new Set(state.bookmarks.map((item) => normalizeWord(item.word)));
            storyEl.querySelectorAll(".word").forEach((button) => {
                button.classList.toggle("is-saved", saved.has(button.dataset.word));
            });
        }

        function openTooltip(button) {
            const word = button.dataset.word;
            const meaning = DICTIONARY[word] || "";
            state.activeWord = {
                word,
                display: button.textContent
            };

            tipWordEl.textContent = button.textContent;
            tipMeaningEl.textContent = meaning || "Bu kelime için henüz anlam yok.";
            tipInput.value = meaning;
            tipInput.classList.toggle("visible", !meaning);
            document.querySelector("#save-word").textContent =
                state.bookmarks.some((item) => normalizeWord(item.word) === word) ?
                "✓ Ayraçta kayıtlı" :
                "＋ Ayraç'a ekle";

            tooltip.hidden = false;
            positionTooltip(button);
        }

        function positionTooltip(button) {
            const rect = button.getBoundingClientRect();
            const tipRect = tooltip.getBoundingClientRect();
            const margin = 12;
            let left = Math.min(
                Math.max(margin, rect.left + rect.width / 2 - tipRect.width / 2),
                window.innerWidth - tipRect.width - margin
            );
            let top = rect.top - tipRect.height - 14;

            if (top < margin) top = rect.bottom + 14;
            tooltip.style.left = `${left}px`;
            tooltip.style.top = `${top}px`;
        }

        function addBookmark() {
            if (!state.activeWord) return;

            const {
                word,
                display
            } = state.activeWord;
            const normalized = normalizeWord(word);
            const existing = state.bookmarks.find((item) => normalizeWord(item.word) === normalized);
            if (existing) {
                closeTooltip();
                return;
            }

            const meaning = DICTIONARY[normalized] || tipInput.value.trim();
            if (!meaning) {
                tipInput.classList.add("visible");
                tipInput.focus();
                tipMeaningEl.textContent = "Önce kelimenin anlamını gir.";
                return;
            }

            state.bookmarks.push({
                word: display,
                meaning,
                note: ""
            });
            persistBookmarks();
            renderBookmarks();
            closeTooltip();
        }

        function removeBookmark(word) {
            state.bookmarks = state.bookmarks.filter(
                (item) => normalizeWord(item.word) !== normalizeWord(word)
            );
            persistBookmarks();
            renderBookmarks();
        }

        function closeTooltip() {
            tooltip.hidden = true;
            state.activeWord = null;
        }

        function selectStory(index) {
            currentStoryIndex = index;
            const selected = STORIES[index];
            document.querySelector("#story-title").textContent = selected.title;
            document.querySelector("#story-level").textContent = selected.level;
            document.querySelector("#story-meta").textContent = selected.meta;
            renderStory(selected.paragraphs);
            buildQuiz();
            updateReadingProgress();
            closeTooltip();
            window.scrollTo({ top: 0, behavior: "smooth" });
        }

        const storyPicker = document.querySelector("#story-picker");
        STORIES.forEach((item, index) => {
            const option = document.createElement("option");
            option.value = String(index);
            option.textContent = item.title;
            storyPicker.append(option);
        });
        storyPicker.addEventListener("change", () => selectStory(Number(storyPicker.value)));

        storyEl.addEventListener("click", (event) => {
            const speakButton = event.target.closest(".speak-btn");
            if (speakButton) { speakSentence(speakButton.dataset.sentence); return; }
            const translateButton = event.target.closest(".translate-btn");
            if (translateButton) { toggleSentenceTranslation(translateButton); return; }
            const button = event.target.closest(".word");
            if (!button) return;
            openTooltip(button);
        });

        document.querySelector("#save-word").addEventListener("click", addBookmark);
        listEl.addEventListener("click", (event) => { const toggle = event.target.closest(".note-toggle"); if (toggle) { const editor = toggle.parentElement.querySelector(".note-editor"); editor.hidden = !editor.hidden; toggle.textContent = editor.hidden ? (toggle.textContent === "Notu düzenle" ? "Notu düzenle" : "＋ Not ekle") : "Notu kapat"; return; } const button = event.target.closest(".note-save"); if (!button) return; const input = listEl.querySelector(".note-input[data-note-word=\"" + CSS.escape(button.dataset.noteWord) + "\"]"); if (input) saveBookmarkNote(button.dataset.noteWord, input.value); });
        document.querySelector("#quiz-toggle").addEventListener("click", () => { const panel = document.querySelector("#quiz-panel"); panel.hidden = !panel.hidden; document.querySelector("#quiz-toggle").textContent = panel.hidden ? "Mini testi aç" : "Testi gizle"; });
        document.querySelector("#quiz-panel").addEventListener("click", (event) => { const option = event.target.closest(".quiz-option"); if (option) answerQuiz(option); });
        document.querySelector("#bookmark-open").addEventListener("click", () => { const panel = document.querySelector(".bookmark-panel"); panel.classList.remove("is-collapsed"); document.querySelector("#bookmark-toggle").textContent = "×"; });
        document.querySelector("#bookmark-toggle").addEventListener("click", () => { const panel = document.querySelector(".bookmark-panel"); panel.classList.toggle("is-collapsed"); const closed = panel.classList.contains("is-collapsed"); document.querySelector("#bookmark-toggle").textContent = closed ? "‹" : "×"; document.querySelector("#bookmark-toggle").setAttribute("aria-label", closed ? "Ayraç panelini aç" : "Ayraç panelini kapat"); });
        document.querySelector("#close-tip").addEventListener("click", closeTooltip);
        const adminModal = document.querySelector("#admin-modal");
        document.querySelector("#admin-open").addEventListener("click", () => { adminModal.hidden = false; document.querySelector("#admin-story-title").focus(); });
        document.querySelector("#admin-close").addEventListener("click", () => { adminModal.hidden = true; });
        adminModal.addEventListener("click", (event) => { if (event.target === adminModal) adminModal.hidden = true; });
        document.querySelector("#admin-form").addEventListener("submit", (event) => {
            event.preventDefault();
            const paragraphs = document.querySelector("#admin-story-text").value.split(/\n+/).map((line) => line.trim()).filter(Boolean);
            const story = { title: document.querySelector("#admin-story-title").value.trim(), level: document.querySelector("#admin-story-level").value.trim() || "A1 · Easy story", meta: document.querySelector("#admin-story-meta").value.trim() || "New story", paragraphs };
            customStories.push(story); localStorage.setItem(CUSTOM_STORIES_KEY, JSON.stringify(customStories)); STORIES.push(story);
            const addedWords = {};
            document.querySelector("#admin-story-words").value.split(/\n+/).forEach((line) => { const parts = line.split("="); if (parts.length > 1) { const key = normalizeWord(parts[0].trim()); const value = parts.slice(1).join("=").trim(); DICTIONARY[key] = value; addedWords[key] = value; } });
            let savedWords = {}; try { savedWords = JSON.parse(localStorage.getItem(CUSTOM_DICTIONARY_KEY) || "{}"); } catch {}
            localStorage.setItem(CUSTOM_DICTIONARY_KEY, JSON.stringify(Object.assign(savedWords, addedWords)));
            const option = document.createElement("option"); option.value = String(STORIES.length - 1); option.textContent = story.title; storyPicker.append(option); storyPicker.value = String(STORIES.length - 1); selectStory(STORIES.length - 1);
            document.querySelector("#admin-message").textContent = "Kaydedildi"; setTimeout(() => { adminModal.hidden = true; document.querySelector("#admin-message").textContent = ""; }, 700);
        });


        document.addEventListener("click", (event) => {
            if (!tooltip.hidden && !tooltip.contains(event.target) && !event.target.closest(".word")) {
                closeTooltip();
            }
        });
        document.addEventListener("keydown", (event) => {
            if (event.key === "Escape") closeTooltip();
        });
        window.addEventListener("scroll", updateReadingProgress);
        window.addEventListener("resize", updateReadingProgress);
        window.addEventListener("resize", () => {
            if (!tooltip.hidden && state.activeWord) {
                const activeButton = [...storyEl.querySelectorAll(".word")]
                    .find((button) => button.dataset.word === state.activeWord.word);
                if (activeButton) positionTooltip(activeButton);
            }
        });

        selectStory(currentStoryIndex);
        renderBookmarks();
    </script>
</body>

</html>
